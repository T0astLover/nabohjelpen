{% extends "base.html" %}

{% block title %}Logg inn - Nabohjelpen{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto;">
    <div class="card">
        <div class="card-header">
            <h2 class="card-title text-center">Logg inn</h2>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="form-group">
                    <label>Brukernavn</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>

                <div class="form-group">
                    <label>Passord</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                {% if form.non_field_errors %}
                    <div class="message error">
                        {{ form.non_field_errors }}
                    </div>
                {% endif %}

                <button type="submit" class="btn btn-primary" style="width: 100%;">Logg inn</button>
            </form>

            <p class="text-center mt-1">
                Ikke medlem ennå? <a href="{% url 'registrering' %}">Registrer deg her</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
